# The pipeline qits-ci runs on every push to a tracked branch of this repository.
#
# One ordinary sandboxed step, and no image: this repository does not ship a container. The app is
# packaged and served by qits-ci, which carries this repo as a git submodule at
# service/src/main/webui — Quinoa's ui-dir — and builds it into the service image at /ci/, so this
# pipeline's job is to keep main green (install, lint, test, build), and qits-ci's own pipeline is
# where the bundle becomes deployable.
#
# The recipe below is qits-spa-home's, and that repo is where it is maintained; the two should keep
# matching. Unlike the other service SPAs there is no divergence to note: this repository carries an
# eslint.config.js and a `lint` script, so the `npm run lint` line the sibling recipes document as
# missing is present here.
steps:
  - image: qits/build-images/node-base:latest
    timeout-seconds: 1800
    script: |
      # The daemon runs this with `bash -c` and no -e, so without this an early failure would be
      # swallowed by the next command's exit code. -u is load-bearing too: an unset registry var
      # must stop the step, not quietly resolve the @qits scope against npmjs.org, where these
      # packages do not exist and never will.
      set -eu

      # THE LOCKFILE is the one file this step edits, and npm leaves no alternative.
      #
      # npm pins a full resolved URL per package, and this lockfile is generated on the deployment
      # host, so every entry names a localhost port — an address that does not exist in this
      # container. `npm ci` fetches tarballs by that URL and never asks the configured registry for
      # them, so the environment below does not reach them: without this swap the install dies on
      # connection refused. The paths are identical on every address, so replacing the ORIGIN and
      # keeping the path is all it takes, and the integrity hashes are what make that safe — bytes
      # from the other address must still hash the same. The clone is this step's own; nothing is
      # edited that anyone will ever read again.
      #
      # THE BYTE PLANE IS TWO SERVICES SINCE THE SPLIT, WHICH IS WHY THE SWAP READS THE PATH.
      # qits-platform-mirror holds the npmjs pull-through cache; qits-artifacts hosts the @qits
      # scope. No single origin serves both, so the path is what tells them apart: an entry under
      # the hosted registry's own pathname — $QITS_NPM_REGISTRY_URL's, /artifacts/npm/npm/ — is a
      # @qits tarball and gets the hosted origin, and every other entry gets the proxy's.
      # Flattening all of them to one origin is what this step did until the split, and it sends
      # every @qits tarball to the mirror, which has never held one: 404, on every run.
      #
      # THE ORDER OF THE TWO EXPRESSIONS IS THE WHOLE TRICK. sed applies -e in sequence per line,
      # so the broad proxy swap runs FIRST and the narrow path-anchored one corrects the @qits
      # entries after it. The other order lets the broad expression undo the narrow one.
      #
      # npm's own knob for exactly this, `--replace-registry-host=always`, cannot do it against a
      # registry mounted under a path, and could not have told two registries apart either.
      # @npmcli/arborist glues rather than resolves (reify.js:
      # `registry.slice(0, -1) + resolvedURL.pathname`), so
      # http://qits-platform-mirror:8080/artifacts/npm/npmjs/ + /artifacts/npm/npmjs/zone.js/-/…tgz
      # comes out as …/artifacts/npm/npmjs/artifacts/npm/npmjs/zone.js/-/…tgz and every tarball
      # 404s. Measured on npm 10.9.4.
      #
      # Every address is derived from the injected env rather than spelled here: no repository
      # states a deployment's addresses, and the two this repo does state (localhost:8081 for the
      # @qits scope and localhost:8082 for npmjs, in .npmrc, for a developer on the host) are the
      # ones being replaced.
      npm_hosted_origin=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).origin')
      npm_proxy_origin=$(node -p 'new URL(process.env.QITS_NPM_PROXY_URL).origin')
      npm_hosted_path=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).pathname')
      sed -i -E \
        -e "s#(\"resolved\": \")https?://[^/\"]+#\1$npm_proxy_origin#" \
        -e "s#(\"resolved\": \")https?://[^/\"]+($npm_hosted_path)#\1$npm_hosted_origin\2#" \
        package-lock.json

      # ENVIRONMENT, not a file. This repository COMMITS an .npmrc (localhost:8081 for @qits and
      # localhost:8082 for npmjs, right for a developer on the host), and npm ranks a project
      # .npmrc ABOVE ~/.npmrc — so the `cat > ~/.npmrc` preamble the library repos use would be
      # written and silently ignored. `npm_config_*` environment outranks both files, so it wins
      # without touching the tree.
      env npm_config_registry="$QITS_NPM_PROXY_URL" \
          "npm_config_@qits:registry=$QITS_NPM_REGISTRY_URL" \
          npm ci --no-audit --no-fund

      npm run lint

      # The jsdom target. This image has no browser and CI is not the place to download one.
      npm run test

      npm run build

  - image: qits/build-images/node-base:latest
    branches:
      - prefix: maintenance/
    timeout-seconds: 300
    script: |
      set -eu
      case "$QITS_CI_BRANCH" in
        maintenance/*) ;;
        *) echo "not a maintenance branch: $QITS_CI_BRANCH"; exit 1 ;;
      esac
      summary=$(git log -1 --format=%s)

      # AUTHORIZATION, and why this step grew one. The release door is machine-authenticated —
      # qits-workspaces runs with QITS_AUTH_MACHINE_REQUIRED=true — so the POST below with no
      # Authorization header is answered 401, and the step goes red with `release refused: HTTP
      # 401`. It did exactly that on every maintenance bump from the day machine auth was switched
      # on: this step predates the switch, nothing about the bump train changed, and because the
      # only leg that fails is the last one, each bump landed on its branch and quietly stayed
      # there — green build, no release, no announcement, nobody told.
      #
      # THE CREDENTIAL IS THIS RUN'S OWN, never a secret written down here. qits-ci commissions an
      # idp client per run and injects it as $QITS_COMMISSIONED_CLIENT_ID and
      # $QITS_COMMISSIONED_CLIENT_SECRET — the same pair an image step hands buildx as a --secret
      # mount, and the same pair qits-git-credential exchanges before a push over HTTP. It is
      # short-lived and revoked at teardown, which is what makes it the only credential a step
      # authored in a repository is allowed to hold.
      #
      # $QITS_GIT_AUTH_TOKEN_URL is the idp's token endpoint. The name says "git" because git's
      # helper was its first caller; the value is the plain token URL, and it is the only idp
      # address a step is given.
      #
      # THE AUDIENCE IS DERIVED, not spelled. A token is cut FOR one service and qits-workspaces
      # refuses one cut for anyone else, so the mint below has to name it — and the name is the
      # host of $QITS_WORKSPACES_URL, which is the service alias, which is what qits-workspaces
      # checks as QITS_AUTH_MACHINE_AUDIENCE. Deriving keeps this deployment out of this file, the
      # same rule $QITS_WORKSPACES_URL itself follows. $QITS_WORKSPACES_AUDIENCE is read first, so
      # a later launcher can state the audience outright without editing every repository carrying
      # this step.
      #
      # NO PAIR, NO HEADER. A deployment that commissions nothing has no pair to exchange and has
      # machine auth off as well, so there the call goes out unauthenticated exactly as it always
      # did, rather than the step dying on a mint it was never going to be able to make. A pair
      # that IS present and cannot be exchanged is the opposite case — a broken platform rather
      # than an unconfigured one — and that is red.
      node -e '
        const [url, branch, summary] = process.argv.slice(1);
        const env = process.env;

        // The bearer the door now demands. With no commissioned pair this resolves to no header at
        // all, which is precisely the call this step used to make.
        const authorize = async () => {
          const id = env.QITS_COMMISSIONED_CLIENT_ID;
          const secret = env.QITS_COMMISSIONED_CLIENT_SECRET;
          const tokenUrl = env.QITS_GIT_AUTH_TOKEN_URL;
          if (!id || !secret || !tokenUrl) return {};
          const audience = env.QITS_WORKSPACES_AUDIENCE || new URL(url).hostname;
          const basic = Buffer.from(id + ":" + secret).toString("base64");
          const res = await fetch(tokenUrl, {
            method: "POST",
            headers: {
              "content-type": "application/x-www-form-urlencoded",
              authorization: `Basic ${basic}`,
            },
            body: new URLSearchParams({ grant_type: "client_credentials", audience }),
          });
          const text = await res.text();
          if (!res.ok) {
            throw new Error(`idp refused the commissioned client for ${audience}: HTTP ${res.status} ${text}`);
          }
          const token = JSON.parse(text).access_token;
          if (!token) throw new Error(`idp returned no access_token for ${audience}`);
          return { authorization: `Bearer ${token}` };
        };

        authorize().then((auth) => fetch(url, {
          method: "POST",
          headers: { "content-type": "application/json", ...auth },
          body: JSON.stringify({ branch, summary }),
        })).then(async (res) => {
          const text = await res.text();
          let body = {};
          try { body = JSON.parse(text); } catch {}
          if (res.ok) {
            console.log(`released ${body.version} as ${body.commitSha} from ${body.branch}`);
            return;
          }
          if (res.status === 409 && body.reason === "ALREADY_INTEGRATED") {
            console.log(`${branch} is already released - nothing to do`);
            return;
          }
          console.error(`release refused: HTTP ${res.status} ${text}`);
          process.exit(1);
        }).catch((err) => {
          console.error(`release call failed: ${err.message}`);
          process.exit(1);
        });
      ' "$QITS_WORKSPACES_URL/workspaces/api/branches/release?repositoryId=$QITS_CI_REPO_ID" \
        "$QITS_CI_BRANCH" "$summary"
