event: SoftwareRelease
when:
  - packageType: { exact: npm }
    packageName: { exact: "@qits/ui-components" }
steps:
  - image: qits/build-images/node-base:latest
    timeout-seconds: 1200
    script: |
      set -eu
      version=$(node -p 'JSON.parse(process.env.QITS_EVENT_PAYLOAD).version')
      # The version reaches a `sed` s### expression below, and `#` is that expression's own
      # delimiter — a version carrying one closes it, and GNU sed's `e` command then runs a shell.
      # Refused rather than quoted: a version here is a calver or a semver, and nothing legitimate
      # needs a character outside this set. The existence check further down happens to reject a `#`
      # too (curl truncates a url at a fragment), but that is an accident of curl, not a guard.
      case "$version" in
        ''|*[!0-9A-Za-z._+-]*) echo "refusing an implausible version: $version" >&2; exit 1 ;;
      esac
      upstream=$(node -p 'JSON.parse(process.env.QITS_EVENT_PAYLOAD).repository')
      if ! env npm_config_registry="$QITS_NPM_PROXY_URL" \
               "npm_config_@qits:registry=$QITS_NPM_REGISTRY_URL" \
               npm view "@qits/ui-components@$version" version >/dev/null 2>&1
      then
        echo "SoftwareRelease said @qits/ui-components@$version is published, but the registry does not have it"
        exit 1
      fi

      # RETARGET, INSTALL, NORMALIZE. The byte plane is TWO SERVICES since the split —
      # qits-platform-mirror holds the npmjs pull-through cache, qits-artifacts hosts the @qits
      # scope — so no single origin serves both and every swap below reads the PATH to tell them
      # apart: an entry under the hosted registry's own pathname ($QITS_NPM_REGISTRY_URL's,
      # /artifacts/npm/npm/) is a @qits tarball, everything else is not.
      #
      # sed applies -e in sequence per line, so the broad swap runs FIRST and the narrow
      # path-anchored one corrects the @qits entries after it. The other order lets the broad
      # expression undo the narrow one.
      npm_hosted_origin=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).origin')
      npm_proxy_origin=$(node -p 'new URL(process.env.QITS_NPM_PROXY_URL).origin')
      npm_hosted_path=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).pathname')
      sed -i -E \
        -e "s#(\"resolved\": \")https?://[^/\"]+#\1$npm_proxy_origin#" \
        -e "s#(\"resolved\": \")https?://[^/\"]+($npm_hosted_path)#\1$npm_hosted_origin\2#" \
        package-lock.json
      env npm_config_registry="$QITS_NPM_PROXY_URL" \
          "npm_config_@qits:registry=$QITS_NPM_REGISTRY_URL" \
          npm install --package-lock-only --no-audit --no-fund "@qits/ui-components@^$version"

      # THE COMMITTED CANONICAL FORM, and the split gave it two origins rather than one. What is
      # pushed back has to be what a developer on the deployment HOST can install from, and .npmrc
      # spells exactly that pair: localhost:8081 for the @qits scope (qits-artifacts) and
      # localhost:8082 for npmjs (qits-platform-mirror). So the normalization is the retargeting
      # written the other way round — same path anchor, same expression order — and the two agree
      # by construction. It costs CI nothing either way, since the retargeting above accepts any
      # origin at all; what a single-origin lockfile would break is the host developer's install,
      # because 8081 no longer serves the npmjs cache.
      sed -i -E \
        -e "s#(\"resolved\": \")https?://[^/\"]+#\1http://localhost:8082#" \
        -e "s#(\"resolved\": \")https?://[^/\"]+($npm_hosted_path)#\1http://localhost:8081\2#" \
        package-lock.json
      if grep '"resolved": "' package-lock.json \
         | grep -vE '"resolved": "http://localhost:(8081|8082)/'; then
        echo "a foreign origin survived in package-lock.json"
        exit 1
      fi
      git add package.json package-lock.json
      if git diff --cached --quiet; then
        echo "@qits/ui-components@$version is already the pin - nothing to hop"
        exit 0
      fi
      git -c user.name="qits release train" -c user.email="release-train@qits.local" \
          commit -q -m "bump(@qits/ui-components@$version): follow the $upstream release"
      git push --force "$QITS_CI_REPOSITORY_URL" "HEAD:refs/heads/maintenance/$upstream"

